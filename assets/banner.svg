<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      
      /* Dynamic Animated Elements */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes flowData {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes orbit {
        0% { transform: rotate(0deg) translateX(35px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(35px) rotate(-360deg); }
      }

      .floating-node-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatSlow 7s ease-in-out infinite 1.5s;
      }
      .floating-node-3 {
        animation: floatSlow 8s ease-in-out infinite 3s;
      }
      .pulsing-orb-1 {
        animation: pulseGlow 5s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .pulsing-orb-2 {
        animation: pulseGlow 6s ease-in-out infinite 2s;
        transform-origin: 1000px 300px;
      }
      .flow-path {
        stroke-dasharray: 8, 8;
        animation: flowData 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep High-Tech Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Background Glowing Orbs (Dynamic Ambience) -->
  <circle class="pulsing-orb-1" cx="200" cy="100" r="160" fill="#38bdf8" opacity="0.25" filter="url(#glowCyan)" />
  <circle class="pulsing-orb-2" cx="1020" cy="220" r="190" fill="#818cf8" opacity="0.2" filter="url(#glowPurple)" />

  <!-- Animated Hypervisor Data Circuit Lines (Background Flow) -->
  <g opacity="0.4">
    <path class="flow-path" d="M 50 360 C 250 360, 200 240, 400 240 L 800 240 C 950 240, 1000 120, 1150 120" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-path" d="M 100 80 C 300 80, 350 180, 550 180 L 850 180 C 1000 180, 1050 340, 1150 340" fill="none" stroke="#c084fc" stroke-width="1.5" />
  </g>

  <!-- Decorative Architectural Nodes on Sides (Preserving foreground clarity) -->
  <g class="floating-node-1" transform="translate(60, 140)">
    <rect width="130" height="70" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="65" y="32" text-anchor="middle" fill="#38bdf8" class="tag-text">VMWARE ESXi</text>
    <text x="65" y="52" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">CBT Snapshots</text>
  </g>

  <g class="floating-node-2" transform="translate(1010, 80)">
    <rect width="130" height="70" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="65" y="32" text-anchor="middle" fill="#c084fc" class="tag-text">NUTANIX AHV</text>
    <text x="65" y="52" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Prism REST &amp; VSS</text>
  </g>

  <g class="floating-node-3" transform="translate(1010, 270)">
    <rect width="130" height="70" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5" />
    <text x="65" y="32" text-anchor="middle" fill="#34d399" class="tag-text">IMMUTABLE</text>
    <text x="65" y="52" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Zero-Trust Backup</text>
  </g>

  <!-- Foreground Title and Branding Card -->
  <!-- Crisp Center Box Ensuring Clear Readability -->
  <g transform="translate(230, 60)">
    <!-- Shield Icon Badge -->
    <g transform="translate(330, 15)">
      <rect x="-24" y="-24" width="48" height="48" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <path d="M 0 -12 L 12 -6 L 12 5 C 12 11, 0 17, 0 17 C 0 17, -12 11, -12 5 L -12 -6 Z" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
      <path d="M -4 2 L -1 5 L 6 -2" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Main Title -->
    <text x="370" y="105" text-anchor="middle" class="title-text" fill="url(#primaryGrad)">
      Enterprise Workload Protection
    </text>

    <!-- Subtitle / Focus -->
    <text x="370" y="145" text-anchor="middle" class="subtitle-text">
      VMware vSphere &amp; Nutanix AHV Backup, Disaster Recovery &amp; Resilience
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(370, 195)">
      <!-- Badge 1: VMware CBT -->
      <g transform="translate(-250, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <text y="4" text-anchor="middle" fill="#e2e8f0" class="tag-text">⚡ Agentless CBT</text>
      </g>
      <!-- Badge 2: Nutanix AHV -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text y="4" text-anchor="middle" fill="#e2e8f0" class="tag-text">🛡️ Nutanix Prism</text>
      </g>
      <!-- Badge 3: Immutable Backups -->
      <g transform="translate(90, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" />
        <text y="4" text-anchor="middle" fill="#e2e8f0" class="tag-text">🔒 Ransomware Safe</text>
      </g>
      <!-- Badge 4: Open Source + SaaS -->
      <g transform="translate(260, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
        <text y="4" text-anchor="middle" fill="#e2e8f0" class="tag-text">🌐 SaaS &amp; Open Source</text>
      </g>
    </g>

    <!-- Bottom Metadata Text -->
    <text x="370" y="255" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b" letter-spacing="1.5">
      HYPERVISOR PROTECTION • INSTANT RECOVERY • SELF-HOSTED &amp; CLOUD ECOSYSTEM
    </text>
  </g>
</svg>
